# 决策 336：推送到 main 与每个 PR 时跑 npm ci 与全量验证；决策 370 起 npm run verify 只跑快档测试，
# CI 跑 npm run verify:full（lint + check + 规格引用检查 + 第三方许可汇总校验 + 锁文件源检查 + 快档与慢档测试 + deps）。
# 依赖变动后先运行 node scripts/third-party-licenses.mjs --write 重新生成汇总。本地合并后直推 main 时 CI 在推送之后才跑，
# 合并前的全量验证由交付者自己跑 verify:full（见 docs/testing.md）。
# 矩阵覆盖 Ubuntu 与 Windows、Node 22.19（engines 下限）与 Node 24。真容器用例在没有所需镜像时照现有逻辑跳过。
# 安装冒烟（scripts/install-smoke.mjs）：打包、装进临时前缀、跑版本与一次假模型的 pigeon run、核对文件清单。
# 所用 action 钉到完整 commit SHA（决策 337），由 Dependabot 提升级 PR。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify:full

      # 决策 351：打包产物的冒烟测试（版本输出；用仓库假模型跑一次 pigeon run，确认发出第一个请求并正常结束）
      - name: Bundle smoke test
        run: npm run bundle && node scripts/bundle-smoke.mjs

      # 安装冒烟：真正的安装包装进临时前缀后跑版本、假模型的 pigeon run 与文件清单核对
      - name: Install smoke test
        run: node scripts/install-smoke.mjs
